<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonLiveTv</title>
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: rgba(17,24,39,0.12);
      --primary: #2563eb;
      --input: #ffffff;
      --shadow: 0 15px 35px rgba(15,23,42,0.12);
    }

    body.dark {
      --bg: #0b1020;
      --card: #111827;
      --text: #f9fafb;
      --muted: #a1a1aa;
      --border: rgba(255,255,255,0.14);
      --primary: #60a5fa;
      --input: #020617;
      --shadow: 0 15px 35px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    .intro-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .intro-content {
      text-align: center;
    }

    .intro-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
      margin: 0 auto 28px;
      animation: logoZoom 2s ease-in-out infinite;
    }

    @keyframes logoZoom {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .tap-text {
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .app {
      display: none;
      width: min(1280px, 94%);
      margin: 0 auto;
      padding: 28px 0 46px;
    }

    .app.show {
      display: block;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: rgba(37,99,235,0.12);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.5rem);
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: var(--shadow);
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 4vw, 3.4rem);
      line-height: 1.05;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 14px;
      margin: 22px 0;
    }

    .search-box,
    select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 18px;
      padding: 15px 17px;
      font-size: 1rem;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .thumb {
      min-height: 150px;
      display: grid;
      place-items: center;
      background: rgba(37,99,235,0.10);
    }

    .thumb img {
      width: 78px;
      height: 78px;
      object-fit: contain;
    }

    .content {
      padding: 18px;
    }

    .tag {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(37,99,235,0.12);
      color: var(--primary);
      font-weight: bold;
      font-size: 0.78rem;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0 0 8px;
    }

    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .watch-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.98rem;
      color: white;
      background: linear-gradient(135deg, #2563eb, #9333ea);
    }

    .empty {
      display: none;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 22px;
      padding: 30px;
      color: var(--muted);
      background: var(--card);
    }

    .empty.active {
      display: block;
    }

    .player-page {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: #000;
    }

    .player-page.show {
      display: block;
    }

    .player-frame {
      width: 100vw;
      height: 100dvh;
      border: none;
      background: #000;
      display: block;
    }

    .back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 6000;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .author {
      position: fixed;
      right: 16px;
      bottom: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      opacity: 0.8;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .theme-toggle {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .intro-logo {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>

<body>

  <audio id="startSound" src="sound.wav" preload="auto"></audio>

  <div class="intro-screen" id="introScreen">
    <div class="intro-content">
      <img src="logo.png" alt="MonLiveTv" class="intro-logo">
      <div class="tap-text">Touchez pour démarrer</div>
    </div>
  </div>

  <main class="app" id="app">
    <header>
      <div class="brand">
        <div class="logo">
          <img src="logo.png" alt="MonLiveTv">
        </div>
        <div>
          <h1>MonLiveTv</h1>
          <p class="subtitle">Recherche, catégories et lecture directe du flux.</p>
        </div>
      </div>

      <button class="theme-toggle" id="themeToggle">🌙 Mode sombre</button>
    </header>

    <section class="hero">
      <h2>Choisis une chaîne et ouvre le direct.</h2>
      <p>
        Utilise la recherche ou les catégories pour filtrer les contenus.
        Chaque chaîne peut utiliser Livewatch, YouTube ou un embed direct.
      </p>
    </section>

    <section class="controls">
      <input id="searchInput" class="search-box" type="search" placeholder="Rechercher une chaîne, une vidéo, un thème...">

      <select id="categorySelect">
        <option value="Tout">Tout</option>
        <option value="Généraliste">Généraliste</option>
        <option value="Jeunesse">Jeunesse</option>
        <option value="Sport">Sport</option>
        <option value="Cinéma">Cinéma</option>
        <option value="Découverte">Découverte</option>
        <option value="Infos">Infos</option>
      </select>
    </section>

    <section class="grid" id="videoGrid"></section>
    <div class="empty" id="emptyState">Aucun résultat trouvé.</div>
  </main>

  <section class="player-page" id="playerPage">
    <button class="back-btn" id="backBtn">← Retour</button>

    <iframe
      id="playerFrame"
      class="player-frame"
      src=""
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </section>

  <div class="author">SnipDav</div>

  <script>
    const videos = [
      {
        title: "Chaîne généraliste",
        category: "Généraliste",
        icon: "icones/exemple.png",
        description: "Flux généraliste en direct.",
        videoUrl: "http://exemple.com/live/generaliste.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Programme jeunesse",
        category: "Jeunesse",
        icon: "icones/exemple2.png",
        description: "Chaîne jeunesse en direct.",
        videoUrl: "http://exemple.com/live/jeunesse.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Ligue1+ HD",
        category: "Sport",
        icon: "icones/ligue1+.png",
        description: "Chaîne sport en direct.",
        videoUrl: "https://cluone.dad/live/388FAA8743C4E2980F7B4089B7E81087/22.m3u8",
        playerType: "embed"
      },
      {
        title: "Vidéo YouTube",
        category: "Généraliste",
        icon: "icones/youtube.png",
        description: "Vidéo YouTube intégrée.",
        videoUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        playerType: "youtube"
      },
      {
        title: "Sélection cinéma",
        category: "Cinéma",
        icon: "icones/exemple4.png",
        description: "Chaîne cinéma en direct.",
        videoUrl: "http://exemple.com/live/cinema.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Documentaire découverte",
        category: "Découverte",
        icon: "icones/exemple5.png",
        description: "Chaîne découverte en direct.",
        videoUrl: "http://exemple.com/live/decouverte.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Journal d’infos",
        category: "Infos",
        icon: "icones/exemple6.png",
        description: "Chaîne info en direct.",
        videoUrl: "http://exemple.com/live/infos.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Embed direct",
        category: "Infos",
        icon: "icones/exemple.png",
        description: "Lecteur embarqué direct.",
        videoUrl: "https://exemple.com/player",
        playerType: "embed"
      }
    ];

    const body = document.body;
    const introScreen = document.getElementById("introScreen");
    const app = document.getElementById("app");
    const startSound = document.getElementById("startSound");

    const themeToggle = document.getElementById("themeToggle");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const videoGrid = document.getElementById("videoGrid");
    const emptyState = document.getElementById("emptyState");

    const playerPage = document.getElementById("playerPage");
    const playerFrame = document.getElementById("playerFrame");
    const backBtn = document.getElementById("backBtn");

    let started = false;

    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
      body.classList.add("dark");
      themeToggle.textContent = "☀️ Mode clair";
    }

    function startSite() {
      if (started) return;
      started = true;

      startSound.volume = 1;
      startSound.currentTime = 0;

      startSound.play()
        .then(() => {
          setTimeout(showSite, 700);
        })
        .catch(() => {
          showSite();
        });
    }

    function showSite() {
      introScreen.classList.add("hide");

      setTimeout(() => {
        introScreen.style.display = "none";
        app.classList.add("show");
      }, 800);
    }

    introScreen.addEventListener("click", startSite);
    introScreen.addEventListener("touchend", startSite);

    themeToggle.addEventListener("click", () => {
      body.classList.toggle("dark");

      const isDark = body.classList.contains("dark");

      themeToggle.textContent = isDark ? "☀️ Mode clair" : "🌙 Mode sombre";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    function getYoutubeEmbedUrl(url) {
      try {
        const parsedUrl = new URL(url);

        if (parsedUrl.hostname.includes("youtube.com")) {
          const videoId = parsedUrl.searchParams.get("v");

          if (videoId) {
            return "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=0";
          }

          if (parsedUrl.pathname.includes("/embed/")) {
            return url;
          }
        }

        if (parsedUrl.hostname.includes("youtu.be")) {
          const videoId = parsedUrl.pathname.replace("/", "");

          if (videoId) {
            return "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=0";
          }
        }

        return url;
      } catch {
        return url;
      }
    }

    function buildPlayerUrl(video) {
      if (video.playerType === "youtube") {
        return getYoutubeEmbedUrl(video.videoUrl);
      }

      if (video.playerType === "embed") {
        return video.videoUrl;
      }

      if (video.playerType === "livewatch") {
        return "https://livewatch.top/player?rl=" + encodeURIComponent(video.videoUrl);
      }

      return video.videoUrl;
    }

    function openStream(video) {
      playerFrame.src = buildPlayerUrl(video);
      playerPage.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closePlayer() {
      playerFrame.src = "";
      playerPage.classList.remove("show");
      document.body.style.overflow = "";
    }

    backBtn.addEventListener("click", closePlayer);

    function renderVideos() {
      const search = searchInput.value.toLowerCase().trim();
      const selectedCategory = categorySelect.value;

      const filteredVideos = videos.filter((video) => {
        const matchesSearch =
          video.title.toLowerCase().includes(search) ||
          video.category.toLowerCase().includes(search) ||
          video.description.toLowerCase().includes(search);

        const matchesCategory =
          selectedCategory === "Tout" || video.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      videoGrid.innerHTML = "";

      filteredVideos.forEach((video) => {
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <div class="thumb">
            <img src="${video.icon}" alt="${video.title}" loading="lazy">
          </div>

          <div class="content">
            <span class="tag">${video.category}</span>
            <h3>${video.title}</h3>
            <p>${video.description}</p>
            <button class="watch-btn" type="button">▶ Regarder</button>
          </div>
        `;

        card.querySelector(".watch-btn").addEventListener("click", () => {
          openStream(video);
        });

        videoGrid.appendChild(card);
      });

      emptyState.classList.toggle("active", filteredVideos.length === 0);
    }

    searchInput.addEventListener("input", renderVideos);
    categorySelect.addEventListener("change", renderVideos);

    renderVideos();
  </script>

</body>
</html>
