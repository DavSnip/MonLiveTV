<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MonLiveTv Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #050505;
            --card: #141414;
            --text: #ffffff;
            --primary: #e50914; /* Rouge Netflix */
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO SCREEN --- */
        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .intro-logo { width: 120px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* --- MAIN APP --- */
        .app { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .app.show { display: block; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo-text { font-size: 1.8rem; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }

        .controls { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box, .category-select {
            background: #222;
            border: 1px solid #333;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 1rem;
        }
        .search-box { flex-grow: 1; }

        /* --- GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }
        .card:hover { transform: scale(1.05); z-index: 10; }
        .thumb { height: 125px; background: #222; display: grid; place-items: center; }
        .thumb img { width: 60px; height: 60px; object-fit: contain; }
        .card-info { padding: 12px; }
        .card-info h3 { margin: 0; font-size: 0.9rem; }
        .tag { font-size: 0.7rem; color: var(--primary); font-weight: bold; }

        /* --- PREMIUM PLAYER PAGE --- */
        #playerPage {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
        }
        #playerPage.show { display: block; }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        /* Player Controls Overlay */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 20px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-container:hover .player-controls { opacity: 1; }

        .player-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }
        .player-btn:hover { background: var(--primary); }
        .close-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); z-index: 10001; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .player-btn { padding: 10px 15px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="intro-screen" id="introScreen">
    <img src="logo.png" class="intro-logo" alt="Logo">
</div>

<main class="app" id="app">
    <header>
        <div class="logo-text">MonLiveTv</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Rechercher une chaîne...">
        <select id="categorySelect" class="category-select">
            <option value="Tout">Tout</option>
            <option value="Généraliste">Généraliste</option>
            <option value="Sport">Sport</option>
            <option value="Infos">Infos</option>
        </select>
    </div>

    <div class="grid" id="videoGrid"></div>
</main>

<section id="playerPage">
    <button class="player-btn close-btn" onclick="closePlayer()">✕ Fermer</button>
    
    <div class="video-container" id="videoContainer">
        <div id="mediaPlaceholder" style="width:100%; height:100%;"></div>

        <div class="player-controls">
            <button class="player-btn" onclick="zap(-1)">❮ Précédent</button>
            <div id="currentChannelTitle" style="font-weight: bold;">Nom de la chaîne</div>
            <button class="player-btn" onclick="zap(1)">Suivant ❯</button>
        </div>
    </div>
</section>

<script>
    const videos = [
        { title: "Ligue1+ HD", category: "Sport", icon: "icones/ligue1+.png", videoUrl: "https://cluone.dad/live/388FAA8743C4E2980F7B4089B7E81087/22.m3u8", type: "hls" },
        { title: "Chaîne Infos", category: "Infos", icon: "icones/exemple6.png", videoUrl: "http://exemple.com/live/infos.m3u8", type: "hls" },
        { title: "Généraliste", category: "Généraliste", icon: "icones/exemple.png", videoUrl: "http://exemple.com/live/generaliste.m3u8", type: "livewatch" }
    ];

    let currentIndex = 0;
    const videoGrid = document.getElementById("videoGrid");
    const playerPage = document.getElementById("playerPage");
    const mediaPlaceholder = document.getElementById("mediaPlaceholder");

    // Démarrage
    document.getElementById("introScreen").addEventListener("click", () => {
        document.getElementById("introScreen").style.display = "none";
        document.getElementById("app").classList.add("show");
        renderVideos();
    });

    function renderVideos() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const cat = document.getElementById("categorySelect").value;
        
        videoGrid.innerHTML = "";
        videos.forEach((v, index) => {
            if ((cat === "Tout" || v.category === cat) && v.title.toLowerCase().includes(search)) {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="thumb"><img src="${v.icon}"></div>
                    <div class="card-info">
                        <div class="tag">${v.category}</div>
                        <h3>${v.title}</h3>
                    </div>
                `;
                card.onclick = () => openPlayer(index);
                videoGrid.appendChild(card);
            }
        });
    }

    function openPlayer(index) {
        currentIndex = index;
        const video = videos[index];
        const container = document.getElementById("videoContainer");
        
        mediaPlaceholder.innerHTML = "";
        document.getElementById("currentChannelTitle").innerText = video.title;

        if (video.type === "livewatch") {
            const ifr = document.createElement("iframe");
            ifr.src = "https://livewatch.top/player?rl=" + encodeURIComponent(video.videoUrl);
            ifr.allow = "autoplay; fullscreen";
            mediaPlaceholder.appendChild(ifr);
        } else {
            const vid = document.createElement("video");
            vid.controls = true;
            vid.autoplay = true;
            mediaPlaceholder.appendChild(vid);
            
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(video.videoUrl);
                hls.attachMedia(vid);
            } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
                vid.src = video.videoUrl;
            }
        }

        playerPage.classList.add("show");
        
        // Tentative de Plein écran auto
        setTimeout(() => {
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
        }, 500);
    }

    function zap(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = videos.length - 1;
        if (currentIndex >= videos.length) currentIndex = 0;
        openPlayer(currentIndex);
    }

    function closePlayer() {
        mediaPlaceholder.innerHTML = "";
        playerPage.classList.remove("show");
        if (document.fullscreenElement) document.exitFullscreen();
    }

    document.getElementById("searchInput").oninput = renderVideos;
    document.getElementById("categorySelect").onchange = renderVideos;
</script>

</body>
</html>
