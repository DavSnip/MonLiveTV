<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonLiveTv</title>
  <link rel="icon" type="image/png" href="logo.png" />

  <style>
    :root {
      --bg: #f5f7fb;
      --card: rgba(255, 255, 255, 0.85);
      --text: #111827;
      --muted: #6b7280;
      --border: rgba(17, 24, 39, 0.10);
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.10);
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.10);
      --input: #ffffff;
    }

    body.dark {
      --bg: #0b1020;
      --card: rgba(17, 24, 39, 0.86);
      --text: #f9fafb;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.12);
      --primary: #60a5fa;
      --primary-soft: rgba(96, 165, 250, 0.15);
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      --input: #111827;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.14), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, rgba(37, 99, 235, 0.22), transparent 35%),
        #020617;
      cursor: pointer;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }

    .intro-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      transform: translateZ(0);
      will-change: transform, opacity;
      animation: smoothLogoPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(37, 99, 235, 0.8));
    }

    @keyframes smoothLogoPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.06);
        opacity: 0.92;
      }
    }

    .tap-text {
      color: white;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      animation: blink 1.1s infinite;
      text-transform: uppercase;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }
    }

    .app {
      width: min(1280px, 94%);
      margin: 0 auto;
      padding: 28px 0 46px;
      display: none;
    }

    .app.active {
      display: block;
      animation: appAppear 0.7s ease both;
    }

    @keyframes appAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(147, 51, 234, 0.18));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.5rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .hero {
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: clamp(20px, 4vw, 38px);
      background: var(--card);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 4vw, 3.6rem);
      letter-spacing: -0.06em;
      line-height: 1.02;
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.7;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 14px;
      margin: 22px 0;
    }

    .search-box,
    select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 18px;
      padding: 15px 17px;
      font-size: 1rem;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: 24px;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
    }

    .thumb {
      min-height: 150px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary-soft), rgba(147, 51, 234, 0.16));
    }

    .thumb img {
      width: 78px;
      height: 78px;
      object-fit: contain;
      border-radius: 18px;
    }

    .content {
      padding: 18px;
    }

    .tag {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      font-size: 0.78rem;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 1.16rem;
    }

    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .watch-btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 13px 16px;
      cursor: pointer;
      font-weight: 900;
      font-size: 0.98rem;
      color: white;
      background: linear-gradient(135deg, #2563eb, #9333ea);
    }

    .empty {
      display: none;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 22px;
      padding: 30px;
      color: var(--muted);
      background: var(--card);
    }

    .empty.active {
      display: block;
    }

    .author {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      opacity: 0.8;
      pointer-events: none;
    }

    .player-page {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      background: #000;
    }

    .player-page.active {
      display: block;
    }

    .player-frame {
      width: 100vw;
      height: 100dvh;
      border: 0;
      display: block;
      background: #000;
    }

    .back-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 6000;
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      font-weight: 900;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .theme-toggle {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .app {
        width: min(94%, 520px);
        padding-top: 18px;
      }

      .intro-logo {
        width: 125px;
        height: 125px;
      }

      .tap-text {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>
  <audio id="startSound" src="sound.wav" preload="auto"></audio>

  <div class="intro-screen" id="introScreen">
    <div class="intro-content">
      <img src="logo.png" alt="MonLiveTv" class="intro-logo" />
      <div class="tap-text">Touchez pour démarrer</div>
    </div>
  </div>

  <main class="app" id="app">
    <header>
      <div class="brand">
        <div class="logo">
          <img src="logo.png" alt="MonLiveTv" />
        </div>
        <div>
          <h1>MonLiveTv</h1>
          <p class="subtitle">Recherche, catégories et lecture directe du flux.</p>
        </div>
      </div>

      <button class="theme-toggle" id="themeToggle">🌙 Mode sombre</button>
    </header>

    <section class="hero">
      <h2>Choisis une chaîne et ouvre le direct.</h2>
      <p>
        Utilise la recherche ou les catégories pour filtrer les contenus.
        Chaque chaîne peut utiliser Livewatch, YouTube ou un embed direct.
      </p>
    </section>

    <section class="controls">
      <input id="searchInput" class="search-box" type="search" placeholder="Rechercher une chaîne..." />

      <select id="categorySelect">
        <option value="Tout">Tout</option>
        <option value="Généraliste">Généraliste</option>
        <option value="Jeunesse">Jeunesse</option>
        <option value="Sport">Sport</option>
        <option value="Cinéma">Cinéma</option>
        <option value="Découverte">Découverte</option>
        <option value="Infos">Infos</option>
      </select>
    </section>

    <section class="grid" id="videoGrid"></section>
    <div class="empty" id="emptyState">Aucun résultat trouvé.</div>
  </main>

  <section class="player-page" id="playerPage">
    <button class="back-btn" id="backBtn">← Retour</button>

    <iframe
      id="playerFrame"
      class="player-frame"
      src=""
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </section>

  <div class="author">SnipDav</div>

  <script>
    const videos = [
      {
        title: "Chaîne généraliste",
        category: "Généraliste",
        icon: "icones/exemple.png",
        description: "Flux direct via Livewatch.",
        videoUrl: "http://exemple.com/live/generaliste.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Vidéo YouTube",
        category: "Généraliste",
        icon: "icones/youtube.png",
        description: "Vidéo YouTube intégrée.",
        videoUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        playerType: "youtube"
      },
      {
        title: "Embed direct",
        category: "Infos",
        icon: "icones/exemple6.png",
        description: "Page externe affichée directement dans l’iframe.",
        videoUrl: "https://exemple.com/player",
        playerType: "embed"
      },
      {
        title: "Ligue1+ HD",
        category: "Sport",
        icon: "icones/ligue1+.png",
        description: "Chaîne sport en direct via Livewatch.",
        videoUrl: "http://pythontv.net:8789/live/x9607/2018123/555898.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Sélection cinéma",
        category: "Cinéma",
        icon: "icones/exemple4.png",
        description: "Une chaîne cinéma en direct.",
        videoUrl: "http://exemple.com/live/cinema.m3u8",
        playerType: "livewatch"
      },
      {
        title: "Documentaire découverte",
        category: "Découverte",
        icon: "icones/exemple5.png",
        description: "Une chaîne découverte en direct.",
        videoUrl: "http://exemple.com/live/decouverte.m3u8",
        playerType: "livewatch"
      }
    ];

    const body = document.body;
    const introScreen = document.getElementById("introScreen");
    const app = document.getElementById("app");
    const startSound = document.getElementById("startSound");

    const themeToggle = document.getElementById("themeToggle");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const videoGrid = document.getElementById("videoGrid");
    const emptyState = document.getElementById("emptyState");

    const playerPage = document.getElementById("playerPage");
    const playerFrame = document.getElementById("playerFrame");
    const backBtn = document.getElementById("backBtn");

    let hasStarted = false;

    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
      body.classList.add("dark");
      themeToggle.textContent = "☀️ Mode clair";
    }

    function startSite() {
      if (hasStarted) return;
      hasStarted = true;

      startSound.currentTime = 0;

      const playPromise = startSound.play();

      setTimeout(() => {
        introScreen.classList.add("hidden");
        app.classList.add("active");

        setTimeout(() => {
          introScreen.style.display = "none";
        }, 750);
      }, 550);

      if (playPromise) {
        playPromise.catch(() => {});
      }
    }

    introScreen.addEventListener("click", startSite);
    introScreen.addEventListener("touchstart", startSite, { passive: true });

    themeToggle.addEventListener("click", () => {
      body.classList.toggle("dark");

      const isDark = body.classList.contains("dark");

      themeToggle.textContent = isDark ? "☀️ Mode clair" : "🌙 Mode sombre";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    function getYoutubeEmbedUrl(url) {
      try {
        const parsedUrl = new URL(url);

        if (parsedUrl.hostname.includes("youtube.com")) {
          const videoId = parsedUrl.searchParams.get("v");

          if (videoId) {
            return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
          }

          if (parsedUrl.pathname.includes("/embed/")) {
            return url;
          }
        }

        if (parsedUrl.hostname.includes("youtu.be")) {
          const videoId = parsedUrl.pathname.replace("/", "");

          if (videoId) {
            return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
          }
        }

        return null;
      } catch {
        return null;
      }
    }

    function buildPlayerUrl(video) {
      const url = video.videoUrl;
      const type = video.playerType || "livewatch";

      if (type === "youtube") {
        return getYoutubeEmbedUrl(url) || url;
      }

      if (type === "embed") {
        return url;
      }

      if (type === "livewatch") {
        return "https://livewatch.top/player?rl=" + encodeURIComponent(url);
      }

      return url;
    }

    function openStream(video) {
      playerFrame.src = buildPlayerUrl(video);
      playerPage.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closePlayer() {
      playerFrame.src = "";
      playerPage.classList.remove("active");
      document.body.style.overflow = "";
    }

    backBtn.addEventListener("click", closePlayer);

    function renderVideos() {
      const search = searchInput.value.toLowerCase().trim();
      const selectedCategory = categorySelect.value;

      const filteredVideos = videos.filter((video) => {
        const matchesSearch =
          video.title.toLowerCase().includes(search) ||
          video.category.toLowerCase().includes(search) ||
          video.description.toLowerCase().includes(search);

        const matchesCategory =
          selectedCategory === "Tout" || video.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      videoGrid.innerHTML = "";

      filteredVideos.forEach((video) => {
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <div class="thumb">
            <img src="${video.icon}" alt="Icône ${video.title}" loading="lazy">
          </div>

          <div class="content">
            <span class="tag">${video.category}</span>
            <h3>${video.title}</h3>
            <p>${video.description}</p>
            <button class="watch-btn" type="button">▶ Regarder</button>
          </div>
        `;

        card.querySelector(".watch-btn").addEventListener("click", () => {
          openStream(video);
        });

        videoGrid.appendChild(card);
      });

      emptyState.classList.toggle("active", filteredVideos.length === 0);
    }

    searchInput.addEventListener("input", renderVideos);
    categorySelect.addEventListener("change", renderVideos);

    renderVideos();
  </script>
</body>
</html>
