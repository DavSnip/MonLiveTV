<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonLiveTv</title>
  <link rel="icon" type="image/png" href="logo.png" />

  <style>
    :root {
      --bg: #f5f7fb;
      --card: rgba(255, 255, 255, 0.85);
      --text: #111827;
      --muted: #6b7280;
      --border: rgba(17, 24, 39, 0.10);
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.10);
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.10);
      --input: #ffffff;
    }

    body.dark {
      --bg: #0b1020;
      --card: rgba(17, 24, 39, 0.86);
      --text: #f9fafb;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.12);
      --primary: #60a5fa;
      --primary-soft: rgba(96, 165, 250, 0.15);
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      --input: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.14), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, rgba(37, 99, 235, 0.18), transparent 35%),
        #020617;
      animation: introFadeOut 2.6s ease forwards;
      pointer-events: none;
    }

    .intro-logo {
      width: 145px;
      height: 145px;
      object-fit: contain;
      animation: netflixIntro 2.35s ease forwards;
    }

    @keyframes netflixIntro {
      0% {
        opacity: 0;
        transform: scale(0.65);
        filter: blur(12px);
      }

      35% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0) drop-shadow(0 0 22px rgba(37, 99, 235, 0.9));
      }

      70% {
        opacity: 1;
        transform: scale(1.14);
        filter: drop-shadow(0 0 38px rgba(255, 115, 0, 0.9));
      }

      100% {
        opacity: 0;
        transform: scale(1.35);
        filter: blur(9px);
      }
    }

    @keyframes introFadeOut {
      0%, 82% {
        opacity: 1;
        visibility: visible;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    .app {
      width: min(1280px, 94%);
      margin: 0 auto;
      padding: 28px 0 46px;
      animation: appAppear 0.8s ease 2.2s both;
    }

    @keyframes appAppear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(147, 51, 234, 0.18));
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .logo:hover {
      transform: scale(1.08) rotate(4deg);
      filter: drop-shadow(0 0 18px rgba(37, 99, 235, 0.55));
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.5rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      transition: transform 0.2s ease, border 0.2s ease;
      white-space: nowrap;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .hero {
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: clamp(20px, 4vw, 38px);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      margin-bottom: 22px;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 4vw, 3.6rem);
      letter-spacing: -0.06em;
      line-height: 1.02;
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.7;
      font-size: clamp(1rem, 1.5vw, 1.15rem);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 14px;
      margin: 22px 0;
    }

    .search-box,
    select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 18px;
      padding: 15px 17px;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .search-box:focus,
    select:focus {
      border-color: var(--primary);
    }

    .player-section {
      display: none;
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      background: var(--card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .player-section.active {
      display: block;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .player-title {
      font-weight: 800;
      font-size: 1.05rem;
    }

    .close-player {
      border: 0;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      border-radius: 999px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.22s ease, border-color 0.22s ease;
      backdrop-filter: blur(18px);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
    }

    .thumb {
      min-height: 150px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary-soft), rgba(147, 51, 234, 0.16));
    }

    .thumb img {
      width: 78px;
      height: 78px;
      object-fit: contain;
      border-radius: 18px;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.18));
    }

    .content {
      padding: 18px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      font-size: 0.78rem;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 1.16rem;
      letter-spacing: -0.03em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .empty {
      display: none;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 22px;
      padding: 30px;
      color: var(--muted);
      background: var(--card);
    }

    .empty.active {
      display: block;
    }

    .author {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      opacity: 0.8;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .theme-toggle {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .app {
        width: min(94%, 520px);
        padding-top: 18px;
      }

      .intro-logo {
        width: 118px;
        height: 118px;
      }
    }

    @media (min-width: 1500px) {
      .app {
        width: min(1600px, 92%);
      }

      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .thumb {
        min-height: 210px;
      }
    }
  </style>
</head>
<body>
  <div class="intro-screen">
    <img src="logo.png" alt="MonLiveTv" class="intro-logo" />
  </div>

  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">
          <img src="logo.png" alt="MonLiveTv" />
        </div>
        <div>
          <h1>MonLiveTv</h1>
          <p class="subtitle">Recherche, catégories et lecteur intégré.</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle">🌙 Mode sombre</button>
    </header>

    <section class="hero">
      <h2>Choisis une vidéo et regarde-la directement ici.</h2>
      <p>
        Utilise la recherche ou le menu des catégories pour filtrer les contenus. Le site s’adapte automatiquement sur mobile, ordinateur et grand écran TV.
      </p>
    </section>

    <section class="controls">
      <input id="searchInput" class="search-box" type="search" placeholder="Rechercher une vidéo, une chaîne, un thème..." />
      <select id="categorySelect">
        <option value="Tout">Tout</option>
        <option value="Généraliste">Généraliste</option>
        <option value="Jeunesse">Jeunesse</option>
        <option value="Sport">Sport</option>
        <option value="Cinéma">Cinéma</option>
        <option value="Découverte">Découverte</option>
        <option value="Infos">Infos</option>
      </select>
    </section>

    <section class="player-section" id="playerSection">
      <div class="player-header">
        <div class="player-title" id="playerTitle">Lecture</div>
        <button class="close-player" id="closePlayer">Fermer</button>
      </div>
      <div class="video-frame" id="videoFrame"></div>
    </section>

    <section class="grid" id="videoGrid"></section>
    <div class="empty" id="emptyState">Aucun résultat trouvé.</div>
  </main>

  <div class="author">SnipDav</div>

  <script>
    const videos = [
      {
        title: "Chaîne généraliste",
        category: "Généraliste",
        icon: "icones/exemple.png",
        description: "Une sélection de contenus variés pour toute la famille.",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      {
        title: "Programme jeunesse",
        category: "Jeunesse",
        icon: "icones/exemple2.png",
        description: "Des vidéos adaptées aux plus jeunes.",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      {
        title: "Émission sport",
        category: "Sport",
        icon: "icones/exemple3.png",
        description: "Résumés, débats et moments forts sportifs.",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      {
        title: "Sélection cinéma",
        category: "Cinéma",
        icon: "icones/exemple4.png",
        description: "Bandes-annonces, critiques et découvertes cinéma.",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      {
        title: "Documentaire découverte",
        category: "Découverte",
        icon: "icones/exemple5.png",
        description: "Culture, nature, histoire et exploration.",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      {
        title: "Journal d’infos",
        category: "Infos",
        icon: "icones/exemple6.png",
        description: "Actualités, reportages et analyses.",
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      }
    ];

    const body = document.body;
    const themeToggle = document.getElementById("themeToggle");
    const searchInput = document.getElementById("searchInput");
    const categorySelect = document.getElementById("categorySelect");
    const videoGrid = document.getElementById("videoGrid");
    const emptyState = document.getElementById("emptyState");
    const playerSection = document.getElementById("playerSection");
    const playerTitle = document.getElementById("playerTitle");
    const videoFrame = document.getElementById("videoFrame");
    const closePlayer = document.getElementById("closePlayer");

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      body.classList.add("dark");
      themeToggle.textContent = "☀️ Mode clair";
    }

    themeToggle.addEventListener("click", () => {
      body.classList.toggle("dark");
      const isDark = body.classList.contains("dark");
      themeToggle.textContent = isDark ? "☀️ Mode clair" : "🌙 Mode sombre";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    function renderVideos() {
      const search = searchInput.value.toLowerCase().trim();
      const selectedCategory = categorySelect.value;

      const filteredVideos = videos.filter((video) => {
        const matchesSearch =
          video.title.toLowerCase().includes(search) ||
          video.category.toLowerCase().includes(search) ||
          video.description.toLowerCase().includes(search);

        const matchesCategory = selectedCategory === "Tout" || video.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      videoGrid.innerHTML = "";

      filteredVideos.forEach((video) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb">
            <img src="${video.icon}" alt="Icône ${video.title}" loading="lazy">
          </div>
          <div class="content">
            <span class="tag">${video.category}</span>
            <h3>${video.title}</h3>
            <p>${video.description}</p>
          </div>
        `;

        card.addEventListener("click", () => openVideo(video));
        videoGrid.appendChild(card);
      });

      emptyState.classList.toggle("active", filteredVideos.length === 0);
    }

    function openVideo(video) {
      playerTitle.textContent = video.title;
      videoFrame.innerHTML = `
        <iframe
          src="${video.embedUrl}?autoplay=1"
          title="${video.title}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
          allowfullscreen>
        </iframe>
      `;
      playerSection.classList.add("active");
      playerSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    closePlayer.addEventListener("click", () => {
      videoFrame.innerHTML = "";
      playerSection.classList.remove("active");
    });

    searchInput.addEventListener("input", renderVideos);
    categorySelect.addEventListener("change", renderVideos);

    renderVideos();
  </script>
</body>
</html>
