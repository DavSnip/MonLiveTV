<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonLiveTv</title>
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    .intro-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .intro-content {
      text-align: center;
    }

    .intro-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
      margin: 0 auto 28px;
      animation: logoZoom 2s ease-in-out infinite;
    }

    @keyframes logoZoom {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .tap-text {
      font-size: 17px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }
    }

    .app {
      display: none;
      padding: 24px;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
    }

    .app.show {
      display: block;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    header img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      color: #111827;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .card img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .watch-btn {
      width: 100%;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      padding: 12px;
      color: white;
      background: linear-gradient(135deg, #2563eb, #9333ea);
      font-weight: bold;
      cursor: pointer;
    }

    .player-page {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: black;
    }

    .player-page.show {
      display: block;
    }

    .player-frame {
      width: 100vw;
      height: 100dvh;
      border: none;
      background: black;
      display: block;
    }

    .back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 6000;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <audio id="startSound" src="sound.wav" preload="auto"></audio>

  <div class="intro-screen" id="introScreen">
    <div class="intro-content">
      <img src="logo.png" alt="MonLiveTv" class="intro-logo">
      <div class="tap-text">Touchez pour démarrer</div>
    </div>
  </div>

  <main class="app" id="app">
    <header>
      <img src="logo.png" alt="MonLiveTv">
      <div>
        <h1>MonLiveTv</h1>
        <p>Choisis une chaîne et ouvre le direct.</p>
      </div>
    </header>

    <section class="grid" id="videoGrid"></section>
  </main>

  <section class="player-page" id="playerPage">
    <button class="back-btn" id="backBtn">← Retour</button>

    <iframe
      id="playerFrame"
      class="player-frame"
      src=""
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </section>

  <script>
    const videos = [
      {
        title: "Ligue1+ HD",
        category: "Sport",
        icon: "icones/ligue1+.png",
        description: "Chaîne sport en direct.",
        videoUrl: "https://cluone.dad/live/388FAA8743C4E2980F7B4089B7E81087/22.m3u8",
        playerType: "embed"
      },
      {
        title: "YouTube Test",
        category: "YouTube",
        icon: "icones/youtube.png",
        description: "Vidéo YouTube de test.",
        videoUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        playerType: "youtube"
      },
      {
        title: "Embed direct",
        category: "Embed",
        icon: "icones/exemple.png",
        description: "Lecteur intégré direct.",
        videoUrl: "https://exemple.com/player",
        playerType: "embed"
      }
    ];

    const introScreen = document.getElementById("introScreen");
    const app = document.getElementById("app");
    const startSound = document.getElementById("startSound");
    const videoGrid = document.getElementById("videoGrid");
    const playerPage = document.getElementById("playerPage");
    const playerFrame = document.getElementById("playerFrame");
    const backBtn = document.getElementById("backBtn");

    let started = false;

    function startSite() {
      if (started) return;
      started = true;

      startSound.volume = 1;
      startSound.currentTime = 0;

      startSound.play()
        .then(() => {
          setTimeout(showSite, 700);
        })
        .catch(() => {
          showSite();
        });
    }

    function showSite() {
      introScreen.classList.add("hide");

      setTimeout(() => {
        introScreen.style.display = "none";
        app.classList.add("show");
      }, 800);
    }

    introScreen.addEventListener("click", startSite);
    introScreen.addEventListener("touchend", startSite);

    function getYoutubeEmbedUrl(url) {
      try {
        const parsedUrl = new URL(url);

        if (parsedUrl.hostname.includes("youtube.com")) {
          const videoId = parsedUrl.searchParams.get("v");
          if (videoId) {
            return "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=0";
          }
        }

        if (parsedUrl.hostname.includes("youtu.be")) {
          const videoId = parsedUrl.pathname.replace("/", "");
          if (videoId) {
            return "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=0";
          }
        }

        return url;
      } catch {
        return url;
      }
    }

    function buildPlayerUrl(video) {
      if (video.playerType === "youtube") {
        return getYoutubeEmbedUrl(video.videoUrl);
      }

      if (video.playerType === "embed") {
        return video.videoUrl;
      }

      if (video.playerType === "livewatch") {
        return "https://livewatch.top/player?rl=" + encodeURIComponent(video.videoUrl);
      }

      return video.videoUrl;
    }

    function openStream(video) {
      playerFrame.src = buildPlayerUrl(video);
      playerPage.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closePlayer() {
      playerFrame.src = "";
      playerPage.classList.remove("show");
      document.body.style.overflow = "";
    }

    backBtn.addEventListener("click", closePlayer);

    function renderVideos() {
      videoGrid.innerHTML = "";

      videos.forEach((video) => {
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <img src="${video.icon}" alt="${video.title}">
          <h3>${video.title}</h3>
          <p>${video.description}</p>
          <button class="watch-btn" type="button">▶ Regarder</button>
        `;

        card.querySelector(".watch-btn").addEventListener("click", () => {
          openStream(video);
        });

        videoGrid.appendChild(card);
      });
    }

    renderVideos();
  </script>

</body>
</html>
